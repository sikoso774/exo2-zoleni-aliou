<h2>Nos 5 Films sélectionnés</h2>

<ul class="liste-films">
  @for (film of films; track film.titre) {
    <li>
      <a href="#" (click)="select_movie(film, $event)">{{ film.titre }}</a>
    </li>
  }
</ul>

@if (filmSelectionne(); as film) {
  <div class="film-detail">
    <h3>{{ film.titre }}</h3>
    <img [src]="film.affiche" [alt]="film.titre" />
  </div>
}
